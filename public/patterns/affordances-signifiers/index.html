<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Affordances and signifiers</title>
  <link rel="stylesheet" href="../pattern.css" />
  <style>
    .hall {
      display: flex;
      justify-content: space-around;
      gap: 16px;
      margin-bottom: 12px;
    }
    .frame {
      width: 92px;
      height: 132px;
      background: #3d3b38;
      border: 3px solid var(--ink);
      border-radius: 3px 3px 0 0;
      perspective: 280px;
    }
    .leaf {
      position: relative;
      width: 100%;
      height: 100%;
      background: #fff;
      transform-origin: left center;
      transition: transform 280ms ease;
    }
    .frame.push .leaf { transform-origin: right center; }
    .frame.pull.open .leaf {
      transform: rotateY(-72deg);
    }
    .frame.push.open .leaf {
      transform: rotateY(72deg);
    }
    .handle,
    .plate {
      position: absolute;
      padding: 0;
      background: var(--bg);
      border: 2px solid var(--ink);
    }
    .handle {
      top: 50%;
      right: 8px;
      width: 14px;
      height: 36px;
      margin-top: -18px;
      border-radius: 3px 10px 10px 3px;
    }
    .plate {
      top: 50%;
      left: 50%;
      width: 22px;
      height: 48px;
      margin: -24px 0 0 -11px;
      border-radius: 3px;
      background: #eceae4;
    }
    .handle:focus-visible,
    .plate:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="demo">
    <div class="stage">
      <h1>Affordances and signifiers</h1>
      <p class="lead">A handle invites pulling; a plate invites pushing — the hardware is the cue.</p>
      <div class="hall">
        <div class="frame pull" id="pull-door">
          <div class="leaf">
            <button type="button" class="handle" id="pull" aria-expanded="false" aria-label="Pull door"></button>
          </div>
        </div>
        <div class="frame push" id="push-door">
          <div class="leaf">
            <button type="button" class="plate" id="push" aria-expanded="false" aria-label="Push door"></button>
          </div>
        </div>
      </div>
      <p class="hint" id="status" role="status">Try each door — the hardware tells you how it opens.</p>
    </div>
  </div>

  <footer class="footnote">
    Created 2026-09-09 · Canon:
    <a href="../../?canon=affordances-and-signifiers" target="_top">Affordances and signifiers</a>
  </footer>
  <script>
    const status = document.getElementById("status");
    function bind(id, doorId, opened, closed) {
      const btn = document.getElementById(id);
      const door = document.getElementById(doorId);
      btn.onclick = () => {
        const open = btn.getAttribute("aria-expanded") !== "true";
        btn.setAttribute("aria-expanded", String(open));
        door.classList.toggle("open", open);
        status.textContent = open ? opened : closed;
      };
    }
    bind("pull", "pull-door", "Pulled open — the handle afforded a grasp.", "Closed. Try the plate on the other door.");
    bind("push", "push-door", "Pushed open — the plate afforded a press.", "Closed. Try the handle on the other door.");
  </script>
</body>
</html>
