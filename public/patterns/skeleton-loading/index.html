<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skeleton loading</title>
  <link rel="stylesheet" href="../pattern.css" />
  <style>
    .card {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .avatar, .line {
      background: #eceae4;
      border-radius: 6px;
    }
    .avatar { width: 40px; height: 40px; border-radius: 50%; }
    .line { height: 10px; margin: 6px 0; }
    .w60 { width: 60%; } .w80 { width: 80%; }
    .pulse { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .name { font-weight: 600; font-size: 0.92rem; }
    .meta { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="demo">
    <div class="stage">
    <h1>Team</h1>
    <p class="lead">Placeholders match the loaded layout so the page doesn’t jump.</p>
    <div id="skel">
      <div class="card pulse"><div class="avatar"></div><div><div class="line w80"></div><div class="line w60"></div></div></div>
      <div class="card pulse"><div class="avatar"></div><div><div class="line w80"></div><div class="line w60"></div></div></div>
      <div class="card pulse"><div class="avatar"></div><div><div class="line w80"></div><div class="line w60"></div></div></div>
    </div>
    <div id="real" hidden></div>
    <button class="btn-ghost" id="reload" style="margin-top:16px">Reload</button>
</div>
  </div>

  <footer class="footnote">
  Created 2026-09-04 · Canon:
  <a href="../../?canon=nielsen-1" target="_top">Nielsen #1 — Visibility of system status</a>
</footer>

  <script>
    const people = [
      ["Amina Chen", "Design"],
      ["Jules Park", "Engineering"],
      ["Samira Ortiz", "Research"],
    ];
    const skel = document.getElementById("skel");
    const real = document.getElementById("real");

    function load() {
      skel.hidden = false;
      real.hidden = true;
      setTimeout(() => {
        real.innerHTML = people.map(([n, r]) =>
          `<div class="card"><div class="avatar"></div><div><div class="name">${n}</div><div class="meta">${r}</div></div></div>`
        ).join("");
        skel.hidden = true;
        real.hidden = false;
      }, 1400);
    }

    document.getElementById("reload").onclick = load;
    load();
  </script>
</body>
</html>
