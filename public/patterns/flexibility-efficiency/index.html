<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flexibility and efficiency</title>
  <link rel="stylesheet" href="../pattern.css" />
  <style>
    kbd {
      font: 0.75rem ui-monospace, monospace; border: 1px solid var(--line);
      border-radius: 4px; padding: 1px 5px; color: var(--muted);
    }
    .item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="demo">
    <div class="stage">
    <h1>Flexibility and efficiency</h1>
    <p class="lead">Nielsen #7 — novices click; experts use accelerators.</p>
    <div class="item"><span>Archive selection</span><span><button class="btn-ghost" data-act="Archive">Do it</button> <kbd>A</kbd></span></div>
    <div class="item"><span>Star thread</span><span><button class="btn-ghost" data-act="Star">Do it</button> <kbd>S</kbd></span></div>
    <div class="item"><span>Mute conversation</span><span><button class="btn-ghost" data-act="Mute">Do it</button> <kbd>M</kbd></span></div>
    <p class="hint" id="out">Click a button or press A / S / M.</p>
</div>
  </div>

  <footer class="footnote">
  Created 2026-09-08 · Canon:
  <a href="../../?canon=nielsen-7" target="_top">Nielsen #7 — Flexibility and efficiency of use</a>
</footer>

  <script>
    const out = document.getElementById("out");
    const map = { a: "Archive", s: "Star", m: "Mute" };
    document.querySelectorAll("[data-act]").forEach((btn) => {
      btn.onclick = () => { out.textContent = "Ran “" + btn.dataset.act + "” via button."; };
    });
    document.addEventListener("keydown", (e) => {
      const act = map[e.key.toLowerCase()];
      if (!act || e.target.matches("input,textarea")) return;
      out.textContent = "Ran “" + act + "” via shortcut.";
    });
  </script>
</body>
</html>
